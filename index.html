<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AKO — Próximamente</title>
<meta name="description" content="El nuevo sitio de Ako está en construcción.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Instrument+Sans:wght@400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F6F3;
    --ink:#131313;
    --ink-soft:#5c5a55;
    --accent:#8a5a24;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Instrument Sans',sans-serif;
    background:var(--bg);color:var(--ink);
    min-height:100svh;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    text-align:center;
    padding:24px;
  }
  .logo{margin:0}
  .logo img{
    width:clamp(220px,42vw,420px);
    height:auto;
    display:block;
  }
  .line{
    width:48px;height:1px;background:var(--ink);
    margin:32px auto;
  }
  p{
    font-size:15px;color:var(--ink-soft);
    max-width:40ch;line-height:1.7;
  }
  #btn-contacto{
    display:inline-block;margin-top:36px;
    font-family:'Archivo',sans-serif;
    font-size:12px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--ink);background:none;border:none;cursor:pointer;
    border-bottom:1px solid var(--ink);padding:0 0 3px;
    transition:color .25s,border-color .25s;
  }
  #btn-contacto:hover{color:var(--accent);border-color:var(--accent)}
  #contactos{
    margin-top:40px;
    display:flex;gap:clamp(24px,6vw,72px);
    flex-wrap:wrap;justify-content:center;
    animation:aparecer .4s ease;
  }
  #contactos[hidden]{display:none}
  @keyframes aparecer{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .card{text-align:center}
  .nombre{
    font-family:'Archivo',sans-serif;
    font-size:13px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--ink);font-weight:500;
  }
  .cargo{font-size:13px;color:var(--accent);margin:4px 0 10px}
  .dato{font-size:14px;color:var(--ink-soft);margin-top:2px;max-width:none}
  .dato a{color:var(--ink-soft);text-decoration:none;border-bottom:1px solid var(--line, #dcd9d2);padding-bottom:1px;transition:color .25s,border-color .25s}
  .dato a:hover{color:var(--accent);border-color:var(--accent)}
  @media (prefers-reduced-motion:reduce){#contactos{animation:none}}
</style>
</head>
